name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.NKT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key (only if you added it)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nkt.jks"
          echo "NKT_KEYSTORE_PATH=$RUNNER_TEMP/nkt.jks" >> "$GITHUB_ENV"

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          NKT_KEYSTORE_PASSWORD: ${{ secrets.NKT_KEYSTORE_PASSWORD }}
          NKT_KEY_ALIAS: ${{ secrets.NKT_KEY_ALIAS }}
          NKT_KEY_PASSWORD: ${{ secrets.NKT_KEY_PASSWORD }}

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk NKT-MP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NKT-MP-apk
          path: NKT-MP.apk
