plugins {
    id 'com.android.application'
}

// Signing: when the GitHub secrets are set, the workflow passes a fixed key in through
// these environment variables, so every new APK installs over the old one as an update.
// Without them the build falls back to a throwaway debug key (still installable).
def ksPath = System.getenv("NKT_KEYSTORE_PATH")

android {
    namespace 'com.nkt.mediaplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.nkt.mediaplayer"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("NKT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NKT_KEY_ALIAS")
                keyPassword System.getenv("NKT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The FTP server and tag libraries carry duplicate licence files; keep one copy.
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's media engine: plays almost every audio/video format, streams (HLS), background playback
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Sharing files from "Share" and showing hidden files with other apps
    implementation 'androidx.core:core:1.13.1'
    // Edit song info and album art inside the file
    implementation 'net.jthink:jaudiotagger:3.0.1'
    // NKT Share: FTP server so a computer can read and write the phone's files
    implementation 'org.apache.ftpserver:ftpserver-core:1.2.0'
    // Other devices: FTP client to browse, stream and copy from other phones and computers
    implementation 'commons-net:commons-net:3.11.1'
}
