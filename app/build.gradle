plugins {
    id 'com.android.application'
}

def ksPath = System.getenv("NKT_KEYSTORE_PATH")

android {
    namespace 'com.nkt.mediaplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nkt.mediaplayer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("NKT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NKT_KEY_ALIAS")
                keyPassword System.getenv("NKT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (ksPath != null && new File(ksPath).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/versions/9/module-info.class',
                         'META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.apache.ftpserver:ftpserver-core:1.2.0'
    implementation 'commons-net:commons-net:3.11.1'
}
