<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Online Music</title>
<style>
  /* NKT Media Player palette (res/values/colors.xml) and the app's Orbitron headings */
  @font-face { font-family: 'Orbitron'; font-weight: 700; src: url('/fonts/orbitron_700.ttf') format('truetype'); }
  @font-face { font-family: 'Orbitron'; font-weight: 900; src: url('/fonts/orbitron_900.ttf') format('truetype'); }
  :root {
    --bg: #05080f; --card: #111827; --accent: #00e5ff; --accent2: #7b61ff;
    --text: #e8f0fe; --muted: #8a9ab2; --danger: #ff4f6a; --success: #00e5a0;
    --border: rgba(0,229,255,0.14);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: sans-serif; overflow-x: hidden; }
  body { padding: 4px 16px 24px; }
  button { font-family: inherit; cursor: pointer; }
  .orb { font-family: 'Orbitron', sans-serif; font-weight: 700; }

  /* ── Player card (video size only) ── */
  #np-card { display: none; flex-direction: column; gap: 10px; padding: 14px; margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 0 40px rgba(0,229,255,0.08); }
  #np-card.active { display: flex; }
  .np-label { font-size: 9px; letter-spacing: 0.22em; color: var(--accent); }
  /* YouTube needs the player visible and at least 200 × 200 */
  #player-box { width: 100%; aspect-ratio: 16 / 9; min-height: 200px; border-radius: 12px; overflow: hidden;
    background: #000; border: 1px solid var(--border); }
  #player-box iframe { width: 100%; height: 100%; border: none; display: block; }
  #np-title { font-size: 14px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #np-channel { font-size: 12px; color: var(--muted); margin-top: -4px; }
  .np-progress { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #seek { flex: 1; accent-color: var(--accent); height: 24px; }
  .np-controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .ctl { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(0,229,255,0.28); background: transparent;
    color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .ctl.main { width: 56px; height: 56px; border-color: rgba(0,229,255,0.4);
    background: linear-gradient(145deg, rgba(0,229,255,0.14), rgba(123,97,255,0.14)); }
  .ctl:disabled { opacity: 0.3; }

  /* ── Ask ── */
  #ask { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 28px; transition: padding 0.2s; }
  #ask-title { font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-align: center; }
  body.playing #ask { padding-top: 0; gap: 10px; }
  body.playing #ask-title { display: none; }

  #waveform { display: flex; align-items: center; gap: 4px; height: 30px; opacity: 0; transition: opacity 0.3s; }
  #waveform.active { opacity: 1; }
  #waveform .bar { width: 4px; height: 4px; border-radius: 2px; background: var(--danger); }
  #waveform.active .bar { animation: wave 0.8s ease-in-out infinite alternate; }
  #waveform.live .bar { animation: none; transition: height 0.08s linear; }
  #waveform .bar:nth-child(2) { animation-delay: 0.1s; } #waveform .bar:nth-child(3) { animation-delay: 0.2s; }
  #waveform .bar:nth-child(4) { animation-delay: 0.05s; } #waveform .bar:nth-child(5) { animation-delay: 0.15s; }
  #waveform .bar:nth-child(6) { animation-delay: 0.25s; } #waveform .bar:nth-child(8) { animation-delay: 0.12s; }
  @keyframes wave { from { height: 4px; } to { height: 28px; } }
  body.playing #waveform { display: none; }

  #mic-btn { position: relative; width: 96px; height: 96px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(0,229,255,0.35); background: linear-gradient(145deg, rgba(0,229,255,0.14), rgba(123,97,255,0.14));
    box-shadow: 0 0 30px rgba(0,229,255,0.22); display: flex; align-items: center; justify-content: center; transition: all 0.25s; }
  body.playing #mic-btn { width: 64px; height: 64px; box-shadow: none; }
  #mic-btn.listening { border-color: var(--danger); background: linear-gradient(145deg, rgba(255,79,106,0.18), rgba(255,79,106,0.06));
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,79,106,0.5); } 50% { box-shadow: 0 0 0 20px rgba(255,79,106,0); } }

  #status { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); min-height: 1.2em; text-align: center; }
  #status.listening { color: var(--danger); } #status.searching { color: var(--accent2); }
  #status.playing { color: var(--success); } #status.error { color: var(--danger); }

  #query-input { width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; outline: none;
    background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 15px; }
  #query-input:focus { border-color: rgba(0,229,255,0.4); }
  #query-input::placeholder { color: var(--muted); }

  #recent { width: 100%; display: none; flex-direction: column; gap: 8px; padding-top: 6px; }
  #recent.show { display: flex; }
  .label { font-size: 10px; letter-spacing: 0.18em; color: var(--muted); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 12px; }

  #note { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; padding: 22px 6px 0; }
  body.playing #note { display: none; }

  /* ── Results ── */
  #results-head { display: none; align-items: center; padding: 16px 2px 8px; }
  #results-head.show { display: flex; }
  #results-head .orb { flex: 1; font-size: 10px; letter-spacing: 0.18em; color: var(--accent); }
  #results-note { font-size: 11px; color: var(--muted); }
  #results { display: flex; flex-direction: column; gap: 6px; }
  .result { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 4px 8px 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .result.playing { border-color: var(--success); }
  .result.playing .r-title { color: var(--accent); }
  .result.skipped { opacity: 0.45; }
  .r-thumb { width: 72px; height: 40px; flex-shrink: 0; border-radius: 8px; object-fit: cover; background: #0b1222; }
  .r-info { flex: 1; min-width: 0; }
  .r-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-meta { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-meta .bad { color: var(--danger); }
  .r-icon { width: 40px; display: flex; justify-content: center; color: rgba(0,229,255,0.55); }
  .result.playing .r-icon { color: var(--success); }
</style>
</head>
<body>

  <!-- Player (video size) -->
  <div id="np-card">
    <div class="np-label orb">NOW PLAYING</div>
    <div id="player-box"></div>
    <div id="np-title"></div>
    <div id="np-channel"></div>
    <div class="np-progress">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
      <span id="t-dur">0:00</span>
    </div>
    <div class="np-controls">
      <button class="ctl" id="prev-btn" onclick="prevTrack()" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6,6h2v12H6zM9.5,12l8.5,6V6z"/></svg>
      </button>
      <button class="ctl main" id="play-btn" onclick="togglePlay()" aria-label="Play or pause"></button>
      <button class="ctl" id="next-btn" onclick="nextTrack()" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- What do you want to play? -->
  <div id="ask">
    <div id="ask-title" class="orb">WHAT DO YOU WANT TO PLAY?</div>
    <div id="waveform"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    <button id="mic-btn" onclick="toggleListen()" aria-label="Say a song">
      <svg id="mic-icon" width="38" height="38" viewBox="0 0 24 24" fill="#00e5ff"><path d="M12,14c1.66,0 2.99,-1.34 2.99,-3L15,5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17.3,11c0,3 -2.54,5.1 -5.3,5.1S6.7,14 6.7,11L5,11c0,3.41 2.72,6.23 6,6.72L11,21h2v-3.28c3.28,-0.48 6,-3.3 6,-6.72h-1.7z"/></svg>
    </button>
    <div id="status">Tap the mic, or type a song name</div>
    <input id="query-input" type="text" placeholder="Type a song name…" autocomplete="off" enterkeyhint="search"
           onkeydown="if(event.key==='Enter'){ this.blur(); }" onblur="if(this.value.trim()) doSearch()" />
    <div id="recent"><div class="label orb">RECENT</div><div id="chips"></div></div>
    <div id="note">Songs come from YouTube and need an internet connection.<br>Your music player pauses while a song plays here.</div>
  </div>

  <div id="results-head"><div class="orb" id="results-count">RESULTS</div><div id="results-note"></div></div>
  <div id="results"></div>

<script>
  // ── Talking to the app ─────────────────────────────────────────────────────
  // NKT.search(q, seq) → NKTresults(seq, json) / NKTsearchFailed(seq, msg)   (the app searches YouTube itself)
  // NKT.listen()        → NKTlistening() · NKTlevel(0..1) · NKTpartial(text) → NKTvoice(text) / NKTvoiceError(msg)
  // NKT.stopListening() — done speaking: the app turns what it heard into NKTvoice(text)
  // NKT.playing(bool)   — the app pauses its own music player while a song plays here
  // NKTpause()          — called by the app when you leave this page or play your own music
  const app = window.NKT || null;

  let lastQuery = '', searchSeq = 0, currentList = [], currentIdx = -1, listening = false;
  const searchCache = new Map();

  function setStatus(msg, type) { const el = document.getElementById('status'); el.textContent = msg; el.className = type || ''; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtSecs(t) {
    t = Math.round(t || 0); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const pad = n => String(n).padStart(2, '0'); return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  // ── Recent searches ────────────────────────────────────────────────────────
  function recentList() { try { return JSON.parse(localStorage.getItem('nkt-online-recent') || '[]'); } catch(_) { return []; } }
  function saveRecent(q) {
    let l = recentList().filter(x => x.toLowerCase() !== q.toLowerCase());
    l.unshift(q); l = l.slice(0, 8);
    try { localStorage.setItem('nkt-online-recent', JSON.stringify(l)); } catch(_) {}
    showRecent();
  }
  function showRecent() {
    const l = recentList(), box = document.getElementById('recent'), chips = document.getElementById('chips');
    chips.innerHTML = '';
    l.forEach(q => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = q;
      b.onclick = () => { document.getElementById('query-input').value = q; lastQuery = ''; doSearch(); }; chips.appendChild(b); });
    box.classList.toggle('show', l.length > 0 && currentIdx < 0);
  }

  // ── Voice ──────────────────────────────────────────────────────────────────
  function setListening(on) {
    listening = on;
    document.getElementById('mic-btn').classList.toggle('listening', on);
    document.getElementById('waveform').classList.toggle('active', on);
    document.getElementById('mic-icon').innerHTML = on
      ? '<rect x="7" y="7" width="10" height="10" rx="2" fill="#ff4f6a"/>'
      : '<path d="M12,14c1.66,0 2.99,-1.34 2.99,-3L15,5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17.3,11c0,3 -2.54,5.1 -5.3,5.1S6.7,14 6.7,11L5,11c0,3.41 2.72,6.23 6,6.72L11,21h2v-3.28c3.28,-0.48 6,-3.3 6,-6.72h-1.7z"/>';
  }
  // Listening happens right here on the page (no pop-up). A song that's playing pauses while you speak.
  let resumeAfterVoice = false;
  function songIsPlaying() {
    try { const st = player && player.getPlayerState ? player.getPlayerState() : -1;
      return st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING; } catch(_) { return false; }
  }
  function toggleListen() {
    if (!app) { setStatus('Type the song name', 'error'); return; }
    if (listening) { app.stopListening(); setStatus('Got it…', 'searching'); return; }   // done speaking
    resumeAfterVoice = songIsPlaying();
    if (resumeAfterVoice) window.NKTpause();
    setListening(true); setStatus('Getting the mic ready…', 'listening');
    app.listen();
  }
  function voiceOver(resume) {
    setListening(false); levels(0);
    if (resume && resumeAfterVoice) { try { player.playVideo(); } catch(_) {} }
    resumeAfterVoice = false;
  }
  const BAR_SHAPE = [0.45, 0.8, 1, 0.65, 0.9, 0.55, 0.75, 0.4];
  function levels(v) {
    const wf = document.getElementById('waveform');
    wf.classList.toggle('live', v > 0);
    wf.querySelectorAll('.bar').forEach((b, i) => {
      b.style.height = v > 0 ? (4 + Math.round(24 * v * BAR_SHAPE[i] * (0.75 + Math.random() * 0.5))) + 'px' : '';
    });
  }
  window.NKTlistening = () => { if (listening) setStatus('Listening… say a song', 'listening'); };
  window.NKTlevel = (v) => { if (listening) levels(Math.max(0, Math.min(1, v))); };
  window.NKTpartial = (text) => { if (listening && text) document.getElementById('query-input').value = text; };
  window.NKTvoice = (text) => {
    voiceOver(false);
    document.getElementById('query-input').value = text;
    lastQuery = ''; doSearch();
  };
  window.NKTvoiceError = (msg) => { voiceOver(true); setStatus(msg, 'error'); };
  window.NKTvoiceStopped = () => { voiceOver(true); setStatus('Tap the mic, or type a song name'); };

  // ── Search ─────────────────────────────────────────────────────────────────
  function doSearch() {
    const q = document.getElementById('query-input').value.trim();
    if (!q || q === lastQuery) return;
    lastQuery = q;
    const seq = ++searchSeq;
    const cached = searchCache.get(q.toLowerCase());
    if (cached) { gotResults(seq, q, cached); return; }
    setStatus('Searching…', 'searching');
    if (!app) { setStatus('Search isn’t available here', 'error'); return; }
    pending[seq] = q;
    app.search(q, seq);
  }
  const pending = {};
  window.NKTresults = (seq, json) => {
    const q = pending[seq]; delete pending[seq];
    let list = []; try { list = JSON.parse(json); } catch(_) {}
    if (q) searchCache.set(q.toLowerCase(), list);
    gotResults(seq, q, list);
  };
  window.NKTsearchFailed = (seq, msg) => {
    delete pending[seq];
    if (seq !== searchSeq) return;
    lastQuery = '';
    setStatus(msg || 'Couldn’t search right now — check the internet and try again', 'error');
  };
  function gotResults(seq, q, list) {
    if (seq !== searchSeq) return;
    if (!list.length) { lastQuery = ''; setStatus('No results — try other words', 'error'); return; }
    if (q) saveRecent(q);
    currentList = list;
    renderResults();
    playIndex(0);
  }

  function renderResults(note) {
    const box = document.getElementById('results'); box.innerHTML = '';
    document.getElementById('results-head').classList.toggle('show', currentList.length > 0);
    document.getElementById('results-count').textContent = 'RESULTS · ' + currentList.length;
    document.getElementById('results-note').textContent = note || '';
    currentList.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'result' + (i === currentIdx ? ' playing' : '') + (r.bad ? ' skipped' : '');
      el.id = 'result-' + i;
      el.innerHTML = `<img class="r-thumb" src="${esc(r.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>
        <div class="r-info"><div class="r-title">${esc(r.title)}</div>
        <div class="r-meta">${esc(r.channel)}${r.duration ? ' · ' + esc(r.duration) : ''}${r.bad ? ' · <span class="bad">can’t be played here</span>' : ''}</div></div>
        <div class="r-icon">${i === currentIdx ? ICON_PAUSE_S : ICON_PLAY_S}</div>`;
      el.onclick = () => playIndex(i);
      box.appendChild(el);
    });
  }

  // ── YouTube player (the official embed; the app's buttons drive it) ────────
  const ICON_PLAY  = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8,5v14l11,-7z"/></svg>';
  const ICON_PAUSE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/></svg>';
  const ICON_PLAY_S  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8,5v14l11,-7z"/></svg>';
  const ICON_PAUSE_S = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/></svg>';
  document.getElementById('play-btn').innerHTML = ICON_PLAY;

  let ytApi = null, player = null, playerReady = null;
  function loadYT() {
    if (ytApi) return ytApi;
    ytApi = new Promise((resolve, reject) => {
      if (window.YT && window.YT.Player) return resolve();
      window.onYouTubeIframeAPIReady = () => resolve();
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = () => { ytApi = null; reject(new Error('Couldn’t load the player — check the internet')); };
      document.head.appendChild(s);
    });
    return ytApi;
  }
  function ensurePlayer() {
    if (playerReady) return playerReady;
    playerReady = loadYT().then(() => new Promise((resolve, reject) => {
      document.getElementById('player-box').innerHTML = '<div id="yt-player"></div>';
      const timer = setTimeout(() => reject(new Error('The player didn’t load — check the internet')), 15000);
      player = new YT.Player('yt-player', {
        width: '100%', height: '100%',
        playerVars: { autoplay: 1, rel: 0, playsinline: 1, controls: 0, fs: 0, iv_load_policy: 3, disablekb: 1, origin: location.origin },
        events: { onReady: () => { clearTimeout(timer); resolve(player); }, onError: onPlayerError, onStateChange: onPlayerState },
      });
    })).catch(e => { playerReady = null; player = null; throw e; });
    return playerReady;
  }
  ensurePlayer().catch(() => {});        // get it ready while you're still choosing

  async function playIndex(idx) {
    const r = currentList[idx];
    if (!r) { setStatus('None of these can be played here — try another search', 'error'); return; }
    currentIdx = idx;
    document.body.classList.add('playing');
    document.getElementById('recent').classList.remove('show');
    const card = document.getElementById('np-card'); card.classList.add('active');
    document.getElementById('np-title').textContent = r.title;
    document.getElementById('np-channel').textContent = r.channel + (r.duration ? ' · ' + r.duration : '');
    document.getElementById('next-btn').disabled = idx + 1 >= currentList.length;
    setSeek(0, 0);
    renderResults();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setStatus('Loading…', 'playing');
    let p; try { p = await ensurePlayer(); } catch(e) { setStatus(e.message, 'error'); return; }
    if (currentIdx !== idx) return;
    p.loadVideoById(r.videoId);
  }

  function onPlayerState(e) {
    const S = YT.PlayerState, btn = document.getElementById('play-btn');
    if (e.data === S.PLAYING) { btn.innerHTML = ICON_PAUSE; setStatus('Now playing', 'playing'); if (app) app.playing(true); }
    if (e.data === S.PAUSED)  { btn.innerHTML = ICON_PLAY;  setStatus('Paused'); if (app) app.playing(false); }
    if (e.data === S.ENDED) {
      btn.innerHTML = ICON_PLAY;
      if (currentIdx + 1 < currentList.length) playIndex(currentIdx + 1);
      else { setStatus('End of the list — what next?'); if (app) app.playing(false); }
    }
  }
  // 100 = removed or private, 101/150 = the owner doesn't allow playing outside YouTube
  function onPlayerError(e) {
    const code = e.data;
    if ([2, 5, 100, 101, 150].includes(code) && currentIdx + 1 < currentList.length) {
      currentList[currentIdx].bad = true;
      setStatus('Can’t be played here — playing the next one…', 'searching');
      playIndex(currentIdx + 1);
      document.getElementById('results-note').textContent = 'Some can’t be played here — skipped';
    } else setStatus('Couldn’t play this one (' + code + ')', 'error');
  }

  function togglePlay() {
    if (!player || !player.getPlayerState) return;
    const st = player.getPlayerState();
    (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) ? player.pauseVideo() : player.playVideo();
  }
  function prevTrack() {
    if (player && player.getCurrentTime && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
    if (currentIdx > 0) playIndex(currentIdx - 1); else if (player && player.seekTo) player.seekTo(0, true);
  }
  function nextTrack() { if (currentIdx + 1 < currentList.length) playIndex(currentIdx + 1); }
  window.NKTpause = () => { try { if (player && player.pauseVideo) player.pauseVideo(); } catch(_) {} };

  let seeking = false;
  const seekEl = document.getElementById('seek');
  function setSeek(cur, dur) {
    if (!seeking) seekEl.value = dur ? Math.round(cur / dur * 1000) : 0;
    document.getElementById('t-cur').textContent = fmtSecs(cur);
    document.getElementById('t-dur').textContent = fmtSecs(dur);
  }
  seekEl.addEventListener('input', () => {
    seeking = true;
    const dur = player && player.getDuration ? player.getDuration() : 0;
    document.getElementById('t-cur').textContent = fmtSecs(seekEl.value / 1000 * dur);
  });
  seekEl.addEventListener('change', () => {
    const dur = player && player.getDuration ? player.getDuration() : 0;
    if (dur) player.seekTo(seekEl.value / 1000 * dur, true);
    seeking = false;
  });
  setInterval(() => { if (player && player.getCurrentTime && currentIdx >= 0) setSeek(player.getCurrentTime(), player.getDuration()); }, 500);

  showRecent();
</script>
